entries:
- version: 8.1.0
  product: Nerdio Manager for Enterprise
  date: '2026-07-21'
  channel: Public Preview
  breaking: false
  highlights:
  - Global Pools for AVD (Preview, Premium only) — pool groups, assignment policies and failover policies for large-scale AVD deployments.
  - AVD Personal to Windows 365 Enterprise migration is now GA.
  - Redesigned left navigation menu enabled by default; legacy menu retires with 8.2.
  - AVD Hybrid for Nutanix (Preview) gains Console Connect support and auto-scale.
  - Azure Files v2 storage account creation supported; new Azure Files > User Profiles tab for FSLogix profiles.
  - Auto-revert option added to Azure Capacity Extender (off by default).
  deprecations:
  - Legacy left navigation menu announced for retirement in 8.2.
- version: 7.2.0
  product: Nerdio Manager for MSP
  date: '2026-07-28'
  channel: Public Preview
  breaking: false
  highlights:
  - Reporting Engine — new Teams, Conditional Access Policies and Purview data collectors; Users collector adds Copilot license and sign-in risk.
  - Reporting Engine now honours RBAC so users cannot view reports for accounts they lack access to.
  - OneDrive and SharePoint collectors can store access certificates in the MSP-level key vault.
  - VIP user protection — mark accounts as VIP and control which RBAC roles may modify or offboard them.
- version: 1.2.0-preview
  product: NerdioManagerPowerShell
  date: '2026-07-22'
  channel: Public Preview
  breaking: false
  highlights:
  - First-party PowerShell module for the NME REST API, generated from the NME API specification with AutoRest.
  - Nerdio warns that functionality, names and behaviours may change until a stable release is announced.
