tools:
- name: check_health
  description: Evaluate overall health of the Distributor API.
  source_operation: openapi/nerdio-distributor-api-openapi.json#GET /api-v{version}/checkhealth
- name: list_installs
  description: Retrieve a list of all NMM installs you have registered via API or Mothership.
  source_operation: openapi/nerdio-distributor-api-openapi.json#GET /api-v{version}/installs
- name: register_installs
  description: Claim a MSP partner's existing and future NMM installs in their Azure Subscription.
  source_operation: openapi/nerdio-distributor-api-openapi.json#POST /api-v{version}/register
- name: suspend_installs
  description: Suspend all installs in an Azure subscription (temporarily halt usage for non-payment).
  source_operation: openapi/nerdio-distributor-api-openapi.json#PUT /api-v{version}/suspend
- name: reactivate_installs
  description: Unsuspend all installs in an Azure subscription.
  source_operation: openapi/nerdio-distributor-api-openapi.json#PUT /api-v{version}/reactivate
- name: cancel_installs
  description: Unregister previously claimed partner NMM installs and suspend those installs.
  source_operation: openapi/nerdio-distributor-api-openapi.json#DELETE /api-v{version}/cancel
- name: get_invoices
  description: Collect consumption information for monthly billing.
  source_operation: openapi/nerdio-distributor-api-openapi.json#GET /api-v{version}/invoices
- name: get_invoices_grouped
  description: Collect consumption information grouped by partner and account.
  source_operation: openapi/nerdio-distributor-api-openapi.json#GET /api-v{version}/invoices/grouped
- name: get_usage
  description: Collect daily usage information.
  source_operation: openapi/nerdio-distributor-api-openapi.json#GET /api-v{version}/usage
risk_notes:
- >-
  register, suspend, reactivate and cancel act on EVERY install in the supplied
  Azure subscription and directly affect a partner MSP's ability to log in. Any
  future agent exposure of these should be gated behind human confirmation.
