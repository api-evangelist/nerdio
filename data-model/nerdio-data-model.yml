notes: >-
  Two disjoint domains. The Distributor domain is derived from the published
  Distributor API OpenAPI — which declares no components.schemas at all, so entities
  and relationships are read from the path/parameter surface and the documented
  response semantics rather than from schema $refs. The Nerdio Manager domain is
  derived from the endpoint paths published for each cmdlet in the first-party
  NerdioManagerPowerShell documentation; relationships are read from path nesting
  (a nested path segment is a containment relationship). No entity, field or
  relationship here is invented — anything not evidenced by a path or a documented
  behaviour is omitted.
domains:
- domain: distributor
  api: Nerdio Manager Distributor API
  entities:
  - name: Distributor
    identified_by: APIKey (request header)
    note: The calling principal. Not addressable as a resource.
    relationships:
    - {type: has_many, target: Install, via: registration}
    - {type: has_many, target: Invoice}
  - name: AzureSubscription
    identified_by: SubscriptionID (GUID, query parameter)
    note: >-
      The join key for every mutating Distributor operation. register, suspend,
      reactivate and cancel all act on ALL installs in a subscription, not on a
      single install.
    relationships:
    - {type: has_many, target: Install, via: SubscriptionID}
  - name: Install
    identified_by: InstallID
    source_operations: ['GET /api-v{version}/installs', 'POST /api-v{version}/register']
    note: >-
      A single Nerdio Manager for MSP deployment. Returned as an array because one
      Azure subscription may carry multiple installs; the docs instruct integrators
      to absorb multiple InstallIDs. States exercised by the API — registered,
      suspended, reactivated, cancelled (cancel also suspends).
    relationships:
    - {type: belongs_to, target: AzureSubscription, via: SubscriptionID}
    - {type: belongs_to, target: Partner}
    - {type: belongs_to, target: Distributor, via: registration}
  - name: Partner
    note: The MSP that owns the install(s). Not directly addressable; surfaced as a grouping dimension on invoices.
    relationships:
    - {type: has_many, target: Install}
    - {type: has_many, target: Account}
  - name: Account
    note: An MSP's end customer. Surfaced as a grouping dimension on GET /invoices/grouped.
    relationships:
    - {type: belongs_to, target: Partner}
  - name: Invoice
    source_operations: ['GET /api-v{version}/invoices', 'GET /api-v{version}/invoices/grouped']
    note: >-
      Monthly billing document, requested by period start/end in mm/dd/yyyy form and
      matching the invoice shown in the Mothership portal. Empty period returns 200
      with an empty body.
    line_item_types:
    - {type: AVD Users, meaning: End users assigned an AVD desktop, averaged over the calendar month}
    - {type: Cloud PC-only Users, meaning: End users assigned a Windows 365 Cloud PC but not an AVD desktop, averaged over the calendar month}
    - {type: Discount, meaning: Cost reduction applied to an account, partner (install) or distributor}
    - {type: Price Control, meaning: A floor or ceiling applied to an account, partner or distributor}
    - {type: Upcharge, meaning: Charges for services other than AVD and Cloud PC licences, applied at invoice level}
    relationships:
    - {type: belongs_to, target: Distributor}
    - {type: has_many, target: InvoiceLineItem}
    - {type: grouped_by, target: Partner, via: /invoices/grouped}
    - {type: grouped_by, target: Account, via: /invoices/grouped}
  - name: Usage
    source_operations: ['GET /api-v{version}/usage']
    note: Daily consumption information, as distinct from the monthly Invoice.
    relationships:
    - {type: belongs_to, target: Install}
  - name: HealthStatus
    source_operations: ['GET /api-v{version}/checkhealth']
    note: Overall API health. No relationships.
