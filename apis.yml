apis:
- name: Nerdio Manager Distributor API
  description: 'Public REST API for Nerdio Manager for MSP distributors. Lets a distributor
    register (claim) a partner MSP''s existing and future NMM installs against an Azure
    subscription, suspend and reactivate installs for non-payment, cancel a registration,
    list registered installs, and pull daily usage and monthly invoice data (including
    invoices grouped by partner and account) for billing. Authenticated with a static
    APIKey request header issued by Nerdio; access to the API key and the Mothership
    licensing portal is requested from nmm.support@getnerdio.com.'
  humanURL: https://nmmhelp.getnerdio.com/hc/en-us/articles/26125597051277-Nerdio-Manager-Distributor-API-Getting-Started
  baseURL: https://nmm-distributor-api.nerdio.net
