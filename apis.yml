- name: Nerdio Manager for MSP Partner API
  description: 'REST API for Nerdio Manager for MSP, used by MSPs to automate at the
    partner and account level what they would otherwise do in the NMM console —
    creating and managing host pools, session hosts and desktop images across their
    client accounts. Enabled per install from System > System Settings > Integrations,
    which provisions an Entra ID application under the nerdio-nmm-app app registration;
    Swagger and a Postman collection are served from the install. Paths are account-scoped
    under /rest-api/v1/accounts/{accountId}/, with a v1-beta surface alongside v1.'
  humanURL: https://nmmhelp.getnerdio.com/hc/en-us/articles/26125599431693-Nerdio-Manager-Partner-API-Getting-Started
  baseURL: https://your-nmm-app.azurewebsites.net/rest-api/v1
  x-base-url-note: 'NMM is customer-deployed; the production host is the MSP''s own
    Azure App Service. There is no single Nerdio-operated host for this API.'
