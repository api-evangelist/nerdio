aid: nerdio
name: Nerdio
description: 'Nerdio (Nerdio, Inc., founded 2017, Chicago) builds automation and cost-optimization
  software for Microsoft cloud desktop environments — Azure Virtual Desktop, Windows
  365, Intune and Microsoft 365. Its two products are Nerdio Manager for Enterprise
  (NME), an Azure-hosted management layer that IT departments deploy into their own
  Azure subscription to provision AVD host pools, manage desktop images, run scripted
  actions and drive auto-scale, and Nerdio Manager for MSP (NMM), a multi-tenant
  console managed service providers use to run hundreds of client environments. Both
  products expose a REST API that customers enable per install (OAuth2 client-credentials
  against Microsoft Entra ID, with Swagger and a downloadable Postman collection served
  from the install itself), and Nerdio additionally operates a public, internet-facing
  Distributor API used by NMM distributors to register, suspend, reactivate and cancel
  partner installs and to pull usage and invoice data. Nerdio publishes a first-party
  PowerShell module generated from the NME API specification with AutoRest.'
