- name: Nerdio Manager for Enterprise REST API
  description: 'REST API for Nerdio Manager for Enterprise. The API is disabled by
    default and is enabled per install from System > Settings > Integrations, which
    provisions an Entra ID application under the nerdio-nmw-app app registration and
    issues a client id/secret. Because NME is deployed into the customer''s own Azure
    subscription, the API is served from that install''s App Service host under /api/v1,
    with interactive Swagger documentation and a downloadable Postman collection served
    from the same install. It covers ARM host pools and session hosts, desktop images,
    auto-scale profiles, scripted actions, app attach, app management policies, FSLogix
    and Azure Files storage, notifications, users and roles, and cost attribution.'
  humanURL: https://nmehelp.getnerdio.com/hc/en-us/sections/19703469488013-REST-API
  baseURL: https://your-nme-app.azurewebsites.net/api/v1
  x-base-url-note: 'NME is customer-deployed; the production host is the customer''s
    own Azure App Service (the documented form used by the first-party PowerShell module
    is Connect-Nme -NmeUri "https://your-nme-app.azurewebsites.net"). There is no
    single Nerdio-operated host for this API.'
  tags:
  - Azure Virtual Desktop
  - Host Pools
  - Desktop Images
  - Auto-scale
  - Automation
